`<tr><td>Cost found from</td><td>${src||'—'}</td></tr>`,`<tr><td>Advantage-only coverage was</td><td>${pct(x.adv_cov)}</td></tr>`])}
<p class=note>Item cost comes first from invoice lines (by UPC), then the vendor cost file, then Advantage's own cost. The margin % on costed items is applied to all sales, so it's rough. Nothing is written to Advantage.</p>
<a class=sw href="${b}/items/${p}">All items with cost source ›</a><br><a class=sw href="${b}/margin/${other}">Switch to ${p==='y'?'month to date':'yesterday'} ›</a></div>
<div class=card><h2>By department</h2>${tbl(['Dept','Sales','Costed','Margin %'],x.depts.map(d=>row(`${b}/items/${p}/${encodeURIComponent(d.name)}`,[E(d.name),$(d.sales),pct(d.cov),d.mp!=null?pct(d.mp):'—'])))}
<p class=note>Covers the top ${x.items.length} items (${pct(x.listed/x.sales)} of sales); Advantage only lists the top 500.</p></div>`);}
function inside(s,p){const b='#/s/'+s.code;const x=s.insp[p];const y=p==='y';const L=s.pnl.purchases.filter(z=>!y||z.date===D.yesterday);
page(E(s.label)+' · Inside '+(y?'yesterday':'month to date'),['#/home/'+s.code,'Dashboard'],`<div class=card><h2>Inside profit ${$(x.profit)}</h2>${tbl(['',''],[
`<tr><td>Inside sales</td><td>${$(x.sales)}</td></tr>`,`<tr><td>− Inside purchases</td><td>${$(-x.purch)}</td></tr>`,`<tr><td><b>Profit</b></td><td><b>${$(x.profit)}</b></td></tr>`])}
<p class=note>Sales minus vendor purchases entered in Advantage for the same period (fuel loads excluded). Day to day this swings with delivery days.</p>
<a class=sw href="${b}/inside/${y?'mtd':'y'}">Switch to ${y?'month to date':'yesterday'} ›</a><br><a class=sw href="${b}/margin/${p}">Item margin by department ›</a></div>
<div class=card><h2>Purchases (${L.length})</h2>${L.length?tbl(['Day','Vendor','Amount','Scan'],L.map(z=>`<tr><td>${dt(z.date)}</td><td>${E(z.who)}${z.check?'<br><small>chk '+E(z.check)+'</small>':''}${z.pm?'<br><small>'+E(z.pm)+'</small>':''}</td><td>${$(z.amt)}</td><td>${z.scan?'<a href="https://app.advantagesystems.ai" target=_blank rel=noopener>on file ↗</a>':'<span class=bad>missing</span>'}</td></tr>`)):'<p class=note>No purchases entered for this period.</p>'}
<p class=note>"On file" opens Advantage (sign in there to view the scan).</p></div>`);}
function items(s,p,dept){const b='#/s/'+s.code;const x=s.inside[p];if(!x)return page('Items',[b+'/margin/'+p,'Margin'],'<div class=card>Not available.</div>');
const L=x.items.filter(i=>!dept||i.dept===dept);
page(E(s.label)+' · '+(dept?E(dept):'Items')+' '+(p==='y'?'yesterday':'MTD'),[b+'/margin/'+p,'Margin'],`<div class=card>${tbl(['Item','Qty','Sales','Cost ea','Margin'],
L.map(i=>`<tr><td>${E(i.name)}<br><small>${E(i.src||'no cost found')}</small></td><td>${G(i.qty)}</td><td>${$(i.sales)}</td><td>${i.unit!=null?$(i.unit):'—'}</td><td>${i.m!=null?pct(i.m):'—'}</td></tr>`))}
<p class=note>${L.length} items. Costs outside 15–105% of the selling price are ignored as bad reads. ${s.dept50?'Open-department sales (rung on the department key, no item) use assumed margins: Kratom/Smokeshop 50%, Coffee 60%, Breakfast/Deli 25%.':''}</p></div>`);}
function cards(s){const b='#/s/'+s.code,c=s.cards;
page(E(s.label)+' · Card deposits',['#/home/'+s.code,'Dashboard'],`<div class=card><h2>${c.n_comp} days compared: NL Petro ${$(c.matched_nlp)} vs Advantage ${$(c.matched_adv)}</h2>
${tbl(['Day','NL Petro','Advantage','Diff'],c.days.slice().reverse().map(d=>`<tr><td>${dt(d.date)}${d.rem?'<br><small>open '+$(d.rem)+'</small>':''}</td><td>${d.nlp!=null?$(d.nlp):'<span class=muted>not posted</span>'}</td><td>${$(d.adv)}</td><td class="${d.diff!=null&&Math.abs(d.diff)>5000?'bad':''}">${d.diff!=null?$(d.diff,true):'—'}</td></tr>`))}
<p class=note>NL Petro POS credit card Amount vs Advantage MOP-Network (credit+debit+mobile). Diff = NL Petro − Advantage. NL Petro side from Batches' last pull (${E(c.src_time||'none')}); Advantage live.</p></div>`);}
function prices(s){const b='#/s/'+s.code,P=s.prices;const r=P.rack,t=P.tonight;const RK={regular:'87',prem:'93',diesel:'diesel'};
const ours=P.ours.map(o=>{const ai=r&&r.all_in?r.all_in[RK[o.g]]:null;return`<tr><td>${GN[o.g]||E(o.g)}</td><td>$${G(o.cash,3)}</td><td>$${G(o.credit,3)}</td><td>${ai?'$'+G(ai,3):'—'}</td><td>${ai?G((o.credit-ai)*100,0)+'¢':'—'}</td></tr>`});
const near=P.nearby.filter(n=>Object.keys(n.p).length&&!n.mine).slice(0,10);
page(E(s.label)+' · Pump prices',['#/home/'+s.code,'Dashboard'],`<div class=card><h2>Our prices</h2>${tbl(['Grade','Cash','Credit','Rack','Margin'],ours)}
<p class=note>Posted prices in Advantage. Rack all-in = NL Petro total with tax + freight, effective ${E(r?.effective||'—')}. Margin = credit price − rack all-in (what a new load would earn).</p></div>
<div class=card><h2>Tonight's rack move</h2>${t&&Object.keys(t.move_cents).length?tbl(['Grade','Expected move','New all-in'],Object.entries(t.move_cents).map(([g,v])=>`<tr><td>${E(g)}</td><td class="${v>0?'bad':'good'}">${v>0?'+':''}${G(v,1)}¢</td><td>$${G(t.after6[g],3)}</td></tr>`)):`<p>No new move pending. The ${E(r?.effective||'')} price ${t?.weekend_hold?'holds through the weekend until Mon 6pm ET':'is the latest'}; Rack posts the next guess around 6pm ET on weekdays.</p>`}
<p class=note>From Rack's latest guess (${E(t?.file||'—')}, dated ${E(t?.date||'—')}). ${t?.weekend_hold?'Friday price holds through the weekend until Mon 6pm ET.':''}</p></div>
<div class=card><h2>Nearby stations</h2>${near.length?tbl(['Station','Mi','Reg','Prem','Diesel'],near.map(n=>`<tr><td>${E(n.name)}<br><small>${E(n.addr)}</small></td><td>${G(n.mi,1)}</td><td>${n.p.regular?'$'+G(n.p.regular.credit||n.p.regular.cash,2):'—'}</td><td>${n.p.prem?'$'+G(n.p.prem.credit||n.p.prem.cash,2):'—'}</td><td>${n.p.diesel?'$'+G(n.p.diesel.credit||n.p.diesel.cash,2):'—'}</td></tr>`)):'<p class=note>No nearby prices available.</p>'}
<p class=note>GasBuddy public prices (credit, or cash if no credit), user-reported and may be hours old. ${P.errors.map(E).join(' ')}</p></div>`);}
function pnl(s){const b='#/s/'+s.code,p=s.pnl;
page(E(s.label)+' · P&amp;L MTD',['#/home/'+s.code,'Dashboard'],`<div class=card><h2>Rough net ${$(p.net)}</h2>${tbl(['',''],[
row(b+'/fuel',['Fuel profit',$(p.fuel)]),row(b+'/inside/mtd',['Inside profit (sales − purchases)',$(p.inside)]),row(b+'/pnl/exp',['− Expenses',$(-p.exp)]),row(b+'/pnl/pay',['− Payroll',$(-p.pay)]),`<tr><td><b>Net</b></td><td><b>${$(p.net)}</b></td></tr>`])}
<p class=note>Month to date. Expenses and payroll are what was paid out and entered in Advantage. Payroll = entries with "payroll" in the note or paid to a person. Not included: rent, utilities paid outside the store, card fees, NL Petro fees, taxes. Inside profit = inside sales − vendor purchases this month (fuel loads excluded).</p>
<a class=sw href="${b}/scans">Purchases list ›</a></div>`);}
function plist(s,kind){const b='#/s/'+s.code,p=s.pnl;const L=kind==='pay'?p.payroll:p.expenses;
page(E(s.label)+' · '+(kind==='pay'?'Payroll':'Expenses')+' MTD',[b+'/pnl','P&L'],`<div class=card><h2>${$(L.reduce((a,x)=>a+x.amt,0))}</h2>${L.length?tbl(['Day','Paid to','Amount'],L.map(x=>`<tr><td>${dt(x.date)}</td><td>${E(x.who)}${x.note?'<br><small>'+E(x.note)+'</small>':''}</td><td>${$(x.amt)}</td></tr>`)):'<p class=note>None this month.</p>'}</div>`);}
function scans(s){const b='#/s/'+s.code,L=s.pnl.purchases;const ns=L.filter(x=>!x.scan);
page(E(s.label)+' · Purchases MTD',['#/home/'+s.code,'Dashboard'],`<div class=card><h2>${ns.length} of ${L.length} purchases missing an invoice scan</h2>${L.length?tbl(['Day','Vendor','Amount','Scan'],L.map(x=>`<tr><td>${dt(x.date)}</td><td>${E(x.who)}${x.check?'<br><small>chk '+E(x.check)+'</small>':''}</td><td>${$(x.amt)}</td><td>${x.scan?'✓':'<span class=bad>missing</span>'}</td></tr>`)):'<p class=note>No purchases this month.</p>'}</div>`);}
function tanks(s){const b='#/s/'+s.code;page(E(s.label)+' · Tanks',['#/home/'+s.code,'Dashboard'],`<div class=card>${tbl(['Grade','Gallons','Avg/day','Days to stop'],
s.tanks.map(t=>row(`${b}/tank/${t.g}`,[GN[t.g]||E(t.g),G(t.level),G(t.avg),t.level<=t.stop?'<b class=bad>AT STOP</b>':`<span class="${t.days!=null&&t.days<3?'bad':''}">${G(t.days,1)}</span>`])))}
<p class=note>Latest reading in Advantage (${dt(s.tanks[0]?.asof)}). Days to stop = (gallons − stop) ÷ 7-day average sold. Stop ${s.tanks.map(t=>(GN[t.g]||t.g)+' '+t.stop).join(', ')} gal.</p></div>`);}
function tank(s,g){const b='#/s/'+s.code;const t=s.tanks.find(z=>z.g===g);if(!t)return page('Tank not found',[b+'/tanks','Tanks'],'<div class=card>Not found.</div>');
page(E(s.label)+' · '+(GN[g]||E(g)),[b+'/tanks','Tanks'],`<div class=card><h2>${G(t.level)} gal · ${t.level<=t.stop?'AT STOP':G(t.days,1)+' days to stop'}</h2>
${tbl(['Day','Open','Delivered','Sold','Close','+/−'],t.rows.slice().reverse().map(r=>`<tr><td>${dt(r.date)}</td><td>${G(r.openGal)}</td><td>${r.deliveredGal?G(r.deliveredGal):''}</td><td>${G(r.soldGal)}</td><td>${G(r.closeGal??r.bookCloseGal)}</td><td>${G(r.overShortGal,1)}</td></tr>`))}
<p class=note>Close = stick reading (book if no stick yet). +/− = stick vs book gallons.</p></div>`);}
function house(s){const b='#/s/'+s.code;const ho=s.house.filter(a=>a.bal>0).reduce((a,x)=>a+x.bal,0);
page(E(s.label)+' · House accounts',['#/home/'+s.code,'Dashboard'],`<div class=card><h2>${$(ho)} owed</h2>${tbl(['Account','Balance','Past due'],
s.house.map(a=>row(`${b}/house/${a.id}`,[E(a.name),$(a.bal),a.pastdue?`<span class=bad>${$(a.pastdue)}</span>`:''])))}
<p class=note>As of end of ${dt(D.yesterday)}. GM / Daily G and COAM gift cards left out; credit (negative) balances not in the total.</p></div>`);}
function acct(s,id){const b='#/s/'+s.code;const a=s.house.find(z=>z.id===id);if(!a)return page('Account not found',[b+'/house','House accounts'],'<div class=card>Not found.</div>');
page(E(s.label)+' · '+E(a.name),[b+'/house','House accounts'],`<div class=card><h2>${$(a.bal)} balance</h2>${tbl(['',''],[`<tr><td>Past due</td><td>${$(a.pastdue)}</td></tr>`,`<tr><td>Next payment date</td><td>${a.next?dt(a.next):'—'}</td></tr>`,`<tr><td>Balance at start of month</td><td>${$(a.opening)}</td></tr>`])}</div>
<div class=card><h2>Ledger this month</h2>${a.events.length?tbl(['Day','Type','Amount','Balance'],a.events.map(e=>`<tr><td>${dt(e.date)}${e.fuel?`<br><small>${E(e.fuel)} ${e.gal?G(e.gal,1)+' gal':''}</small>`:''}${e.pm?`<br><small>${E(e.pm)}</small>`:''}${e.note?`<br><small>${E(e.note)}</small>`:''}</td><td>${E(e.type)}</td><td>${$(e.amt)}</td><td>${$(e.run)}</td></tr>`)):'<p class=note>No activity this month.</p>'}</div>`);}
function paper(code,d){const s=S(code);const k=code+'/'+d;const b64d=D.papers[k];if(!s||!b64d)return page('Shift paper',['#/','Dashboard'],'<div class=card>No PDF.</div>');
const url=URL.createObjectURL(new Blob([b64(b64d)],{type:'application/pdf'}));
page(E(s.label)+' · Shift paper '+dt(d),[`#/s/${code}/diff/${d}`,dt(d)],`<div class=card><a class=btn href="${url}" target=_blank rel=noopener>Open PDF</a> <a class=btn href="${url}" download="${E(s.paperName||'')}${code}-shift-paper-${d}.pdf">Download</a>
<iframe src="${url}" style="width:100%;height:70vh;border:0;margin-top:10px"></iframe></div>`);}
const vr=(i,k)=>`<tr><td>${E(i.name)}<br><small>${E(i.upc)}</small></td><td>${G(i[k],1)}</td><td>${$(k==='d7'?i.sc7:i.sc30)}</td><td>${i.cost?$(i.cost):'—'}</td><td>${pct(i.m)}</td></tr>`;
const vh=k=>['Item · UPC',k==='d7'?'Units/day 7d':'Units/day 30d',k==='d7'?'$ 7d':'$ 30d','Last cost','Margin'];
const VN='<p class=note>Units/day and $ from Advantage sales by UPC. Last cost = newest invoice, then vendor file, then Advantage cost (matched by UPC only). Margin = (avg price − cost) ÷ avg price.</p>';
function velo(s,sub,arg){const b='#/s/'+s.code,v=s.velo,bk=['#/s/'+s.code+'/velo','Velocity'];if(!v)return page('Velocity',['#/home/'+s.code,'Dashboard'],'<div class=card>Not available.</div>');
const L=(t,a)=>`<a class=sw href="${b}/velo/${a}">${t} ›</a>`;
const rf=i=>`<tr><td>${E(i.name)}<br><small>${E(i.upc)}</small></td><td>${G(i.p7,1)} → ${G(i.d7,1)}</td><td>${$(i.sc7)}</td><td>${i.cost?$(i.cost):'—'}</td><td>${pct(i.m)}</td></tr>`;
const rh=['Item · UPC','Units/day prior → last 7d','$ 7d','Last cost','Margin'];
const per=`<p class=note>30d = ${dt(v.from30)}–${dt(D.yesterday)}. 7d = ${dt(v.from7)}–${dt(D.yesterday)}, prior 7d = ${dt(v.pfrom)}–${dt(v.pto)}.</p>`;
if(sub==='top30')return page(E(s.label)+' · Top sellers 30d',bk,`<div class=card>${tbl(vh('d30'),v.top30.map(i=>vr(i,'d30')))}${VN}${per}</div>`);
if(sub==='top7')return page(E(s.label)+' · Top sellers 7d',bk,`<div class=card>${tbl(vh('d7'),v.top7.map(i=>vr(i,'d7')))}${VN}${per}</div>`);
if(sub==='rise')return page(E(s.label)+' · Fastest risers',bk,`<div class=card>${tbl(rh,v.risers.map(rf))}<p class=note>Last 7 days vs the 7 days before. Only items with at least 5 units in one of the two weeks.</p>${per}</div>`);
if(sub==='fall')return page(E(s.label)+' · Fastest fallers',bk,`<div class=card>${tbl(rh,v.fallers.map(rf))}<p class=note>Last 7 days vs the 7 days before. Only items with at least 5 units in one of the two weeks.</p>${per}</div>`);
if(sub==='slow')return page(E(s.label)+' · Slow movers',bk,`<div class=card>${tbl(vh('d30'),v.slow.map(i=>vr(i,'d30')))}<p class=note>Sold 1–3 units in 30 days and has a known cost.</p>${per}</div>`);
if(sub==='dead')return page(E(s.label)+' · Dead stock',bk,`<div class=card><h2>${G(v.deadb_n)} items bought in last 90 days, 0 sold in 30</h2>${tbl(['Item · UPC','Dept','Last cost','Cost date'],v.deadb.map(d=>`<tr><td>${E(d.name||'(no name)')}<br><small>${E(d.upc)}</small></td><td>${E(d.dept)}</td><td>${$(d.cost)}</td><td>${d.last?dt(d.last):'—'}</td></tr>`))}
<p class=note>Showing up to 80, newest purchase first. Separately, ${G(v.dead_n)} items in Advantage have a cost but no sales in 30 days (old pricebook entries included). Only UPCs that exist in the Advantage pricebook (case/carton barcodes left out). On-hand counts are off in Advantage, so we can't tell what is actually on the shelf. Check UPC/barcode before pulling anything: an item may scan under a different UPC.</p></div>`);
if(sub==='dept'&&arg){const its=[...v.top30,...v.top7,...v.risers,...v.fallers,...v.slow].filter((x,i,a)=>x.dept===arg&&a.findIndex(z=>z.upc===x.upc)===i).sort((a,b)=>b.d30-a.d30);
return page(E(s.label)+' · '+E(arg),[b+'/velo/dept','Departments'],`<div class=card>${its.length?tbl(vh('d30'),its.map(i=>vr(i,'d30'))):'<p class=note>No items from this department in the top lists.</p>'}<p class=note>Items from the top, riser, faller and slow lists in this department.</p></div>`);}
if(sub==='dept')return page(E(s.label)+' · Velocity by department',bk,`<div class=card>${tbl(['Department','Units/day 30d','Last 7d vs prior','$ 30d'],v.depts.map(d=>row(`${b}/velo/dept/${encodeURIComponent(d.name)}`,[E(d.name),G(d.q30/30,1),`<span class="${d.qp7&&d.q7<d.qp7*0.8?'bad':''}">${G(d.q7/7,1)} vs ${G(d.qp7/7,1)}</span>`,$(d.sc30)])))}<p class=note>From item sales by UPC (top ${G(v.n_sold)} items). Department from the Advantage pricebook.</p></div>`);
if(sub==='order'&&arg){const o=v.orders.find(z=>z.v===arg);if(!o)return page('Vendor not found',[b+'/velo/order','Order ideas'],'<div class=card>Not found.</div>');
return page(E(s.label)+' · '+E(o.v),[b+'/velo/order','Order ideas'],`<div class=card><h2>About ${$(o.cost)}</h2>${tbl(['Item · UPC','Units/day 30d','Order','Last cost'],o.items.map(i=>`<tr><td>${E(i.name)}<br><small>${E(i.upc)}</small></td><td>${G(i.d30,1)}</td><td><b>${i.ord.qty}</b> ${E(i.ord.lab)}${i.ord.n>1?` of ${i.ord.n}`:''}</td><td>${i.cost?$(i.cost):'—'}</td></tr>`))}
<p class=note>Suggested = ${v.cover} days of 30-day sales, rounded up to the vendor unit. <b>Assumes nothing on the shelf</b> (Advantage has no on-hand counts), so subtract what you see. Only box of 25 (Black &amp; Mild), carton of 10 (24/7) and cartons/boxes matched on invoices are used; everything else is single units. Case sizes for beer/soda are not confirmed, so they are not converted.</p></div>`);}
if(sub==='order')return page(E(s.label)+' · Order ideas',bk,`<div class=card>${v.orders.length?tbl(['Vendor','Items','≈ Cost'],v.orders.map(o=>row(`${b}/velo/order/${encodeURIComponent(o.v)}`,[E(o.v),o.items.length,$(o.cost)]))):'<p class=note>No vendor map for this store yet.</p>'}<p class=note>${v.cover} days of sales per item, assuming empty shelf. Draft only, nothing is sent to vendors.</p></div>`);
const t=v.top30.slice(0,10);const pk='velo/'+s.code,pdfu=D.papers[pk]?URL.createObjectURL(new Blob([b64(D.papers[pk])],{type:'application/pdf'})):null;
page(E(s.label)+' · Velocity',['#/home/'+s.code,'Dashboard'],`${pdfu?`<div class=card><a class=btn href="${pdfu}" download="${E(s.velo_pdf)}">Download printable PDF</a> <a class=btn href="${pdfu}" target=_blank rel=noopener>Open</a></div>`:''}<div class=card><h2>Top 10 sellers · 30 days</h2>${tbl(vh('d30'),t.map(i=>vr(i,'d30')))}${L('All top sellers 30d','top30')}<br>${L('Top sellers last 7d','top7')}</div>
<div class=card><h2>Moving</h2>${tbl(['','Items'],[row(b+'/velo/rise',['Fastest risers',v.risers.length]),row(b+'/velo/fall',['Fastest fallers',v.fallers.length]),row(b+'/velo/slow',['Slow movers (1–3 sold in 30d)',v.slow.length]),row(b+'/velo/dead',['Dead stock (bought, 0 sold in 30d)',v.deadb_n]),row(b+'/velo/dept',['By department',v.depts.length])].concat(v.has_rules?[row(b+'/velo/order',['Order ideas by vendor',v.orders.length])]:[]))}${per}</div>`);}
function route(){const h=location.hash.replace(/^#\/?/,'').split('/');try{
if(h[0]==='s'&&S(h[1])){const s=S(h[1]);localStorage.setItem('acstore',s.code);switch(h[2]){
case'diff':return h[3]?diffDay(s,h[3]):diff(s);case'fuel':return h[3]==='day'?fuelDay(s,h[4]):fuel(s);case'load':return load(s,h[3]);
case'food':return food(s,h[3]?decodeURIComponent(h[3]):null);case'inside':return inside(s,h[3]==='y'?'y':'mtd');case'margin':return margin(s,h[3]==='y'?'y':'mtd');case'items':return items(s,h[3]==='y'?'y':'mtd',h[4]?decodeURIComponent(h[4]):null);case'velo':return velo(s,h[3],h[4]?decodeURIComponent(h[4]):null);case'cards':return cards(s);case'prices':return prices(s);case'pnl':return h[3]?plist(s,h[3]):pnl(s);case'scans':return scans(s);case'tanks':return tanks(s);case'tank':return tank(s,h[3]);case'house':return h[3]?acct(s,h[3]):house(s);}}
if(h[0]==='paper')return paper(h[1],h[2]);if(h[0]==='home')return home(h[1]);if(h[0]==='alerts')return alerts(h[1]);}catch(e){console.error(e);return page('Error',['#/','Dashboard'],'<div class=card>Something went wrong: '+E(e.message)+'</div>');}
home();}
</script></body></html>
