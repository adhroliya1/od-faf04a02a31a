#gate label{font-size:15px;color:var(--ink2);display:flex;gap:8px;align-items:center}#gate input[type=checkbox]{width:20px;height:20px;accent-color:var(--tint)}
header{position:sticky;top:0;z-index:5;background:var(--hdr);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);color:var(--ink);padding:6px 14px 7px;padding-top:max(6px,env(safe-area-inset-top));border-bottom:.5px solid var(--line)}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}

a.abar{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card);color:var(--ink2);text-decoration:none;font-size:14px;box-shadow:0 0 0 .5px var(--line)}a.abar b{color:var(--ink);font-weight:600}a.abar.hot{background:var(--red-bg);box-shadow:none}a.abar.hot b{color:var(--red)}a.abar .dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--red)}a.abar .chev{color:var(--mute)}
main{padding:8px 10px calc(10px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}.card{background:var(--card);border-radius:var(--r);padding:11px 12px;margin:0 0 9px;box-shadow:0 0 0 .5px var(--line)}.card h2{font-size:16px;letter-spacing:-.01em;margin:0 0 6px;font-weight:650}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.foot{font-size:11px;color:var(--mute);margin:7px 2px 0;text-align:center}

.strip-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--mute);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.03em;padding:2px 14px 3px 0;position:relative;line-height:1.2}
.strip-hd:after{content:"›";position:absolute;right:0;top:50%;transform:translateY(-50%);color:var(--mute);font-size:16px;opacity:.55;text-transform:none;letter-spacing:0;font-weight:500}

a.al.bad{color:var(--red)}
a.strip-fuel{display:block;text-decoration:none;color:inherit}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:1px 0 2px}
.grades i{font-style:normal;display:flex;flex-direction:column;min-width:0}
.grades em{font-style:normal;font-size:10px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.grades b{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:1px 0 0}
.grades small{font-size:11px;color:var(--ink2);line-height:1.2}
.kag{font-size:11px;color:var(--ink2);padding:3px 14px 1px 0;border-top:.5px solid var(--line);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#app.is-home .foot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;margin-top:5px}
button.textbtn{background:none;border:0;color:var(--tint);font:inherit;font-size:11px;font-weight:650;padding:0;cursor:pointer;font-family:inherit}
.foot a{color:var(--tint);text-decoration:none;font-weight:650}
a.btn.draft-kag,a.btn.draft-note{background:var(--tint-bg);color:var(--tint)}
#app.is-glance main{padding:16px 16px 20px}
.glance{display:flex;flex-direction:column;gap:12px}
.g-big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;text-decoration:none;color:var(--ink);display:block}
.g-big.bad{color:var(--red)}
.g-sub{font-size:13px;color:var(--mute);margin-top:-6px}
.g-grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
a.g-tank{background:var(--card);border-radius:var(--r);padding:10px 10px 12px;text-decoration:none;color:inherit;box-shadow:0 0 0 .5px var(--line);display:flex;flex-direction:column;min-width:0}
a.g-tank em{font-style:normal;font-size:11px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
a.g-tank b{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;line-height:1.1}
a.g-tank.bad b{color:var(--red)}
a.g-tank small{font-size:12px;color:var(--ink2)}
a.g-alerts,a.g-kag{background:var(--card);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);font-weight:650;box-shadow:0 0 0 .5px var(--line);display:block}
a.g-alerts.hot{color:var(--red);background:var(--red-bg);box-shadow:none}
a.g-kag{font-size:14px;font-weight:550;color:var(--ink2);line-height:1.35}

<div class=card><h2>Moving</h2>${tbl(['','Items'],[row(b+'/velo/rise',['Fastest risers',v.risers.length]),row(b+'/velo/fall',['Fastest fallers',v.fallers.length]),row(b+'/velo/slow',['Slow movers (1–3 sold in 30d)',v.slow.length]),row(b+'/velo/dead',['Dead stock (bought, 0 sold in 30d)',v.deadb_n]),row(b+'/velo/dept',['By department',v.depts.length])].concat(v.has_rules?[row(b+'/velo/order',['Order ideas by vendor',v.orders.length])]:[]))}${per}</div>`);}
function glance(code){if(code&&S(code))localStorage.setItem('acstore',code);const s=S(cur());const b='#/s/'+s.code;
const y=s.days.find(d=>d.date===D.yesterday);const low=t=>t.level<=t.stop||(t.days!=null&&t.days<=2);
const grades=s.tanks.map(t=>`<a class="g-tank${low(t)?' bad':''}" href="${b}/tank/${t.g}"><em>${E(GN[t.g]||t.g)}</em><b>${t.level<=t.stop?'at stop':(t.days==null?'—':G(t.days,1)+'d')}</b><small>${G(t.level)} gal</small></a>`).join('');
let kag='';if(s.pending&&s.pending.confirmation){const sp=s.pending.split||{};const parts=['regular','prem','diesel'].filter(g=>sp[g]).map(g=>G(sp[g])+' '+({regular:'Reg',prem:'Prem',diesel:'Dsl'}[g]));
let when='';if(s.pending.delivery_date)when=s.pending.delivery_date===todayISO()?'today':dt(s.pending.delivery_date);
kag=`<a class=g-kag href="${b}/tanks">${E(s.pending.confirmation)}${when?' · '+when:''}${parts.length?' · '+parts.join(' / '):''}</a>`}
const body=`<div class=glance><a class="g-big ${osc(y&&y.os)}" href="${b}/diff/${D.yesterday}">${y?OS(y.os):'—'}</a><div class=g-sub>Yesterday · ${dt(D.yesterday)}</div><div class=g-grades>${grades}</div><a class="g-alerts${s.alerts.some(a=>a.lvl==='bad')?' hot':''}" href="#/alerts/${s.code}">${s.alerts.length} alert${s.alerts.length===1?'':'s'}</a>${kag}<a class=sw href="#/home/${s.code}">Open full dash ›</a><p class=note>On iPhone: Share → Add to Home Screen for a one-tap shortcut. iOS can't show a live widget.</p></div>`;
const sel=D.stores.length>1?`<select id=store aria-label="Store">${D.stores.map(z=>`<option value="${z.code}" ${z.code===s.code?'selected':''}>${E(z.label)}</option>`).join('')}</select>`:E(s.label);
page(sel,null,body,'Updated '+E(D.generated),`<a class=abar href="#/home/${s.code}">Dash ›</a>`);
const el=document.getElementById('store');if(el)el.onchange=e=>{location.hash='#/glance/'+e.target.value}}

// t424u: viewer-set inside margin %, saved on this device (localStorage, one key per store); default = store_margins.json
const MK=c=>'acmargin_'+c;
function mGet(c){try{const v=parseFloat(localStorage.getItem(MK(c)));return isFinite(v)&&v>=0&&v<=100?v:null}catch(e){return null}}
function mApply(s){for(const a of['y','mtd']){const x=s.insp&&s.insp[a];if(!x)continue;if(x.pct_default==null)x.pct_default=x.pct;const u=mGet(s.code);x.pct_user=u!=null;x.pct=u!=null?u:x.pct_default;x.profit=Math.round((x.sales||0)*x.pct/100);}
const p=s.pnl,m=s.insp&&s.insp.mtd;if(p&&m){p.inside=m.profit;p.inside_pct=m.pct;p.inside_pct_user=m.pct_user;p.net=(p.fuel||0)+p.inside-(p.exp||0)-(p.pay||0);}}
function mSet(c,v){v=Math.round(Math.min(100,Math.max(0,v))*10)/10;try{localStorage.setItem(MK(c),String(v))}catch(e){}mRedraw();}
function mReset(c){try{localStorage.removeItem(MK(c))}catch(e){}mRedraw();}
function mRedraw(){const y=window.scrollY;route();window.scrollTo(0,y);}
const ML=x=>x.pct_user?'your setting':x.pct_set?'':'placeholder';
const MCTL=(s,big)=>{const x=s.insp.mtd;return `<span class="mctl" data-mstore="${s.code}"><button type=button class=mbtn data-mstep="-1" aria-label="Lower margin">−</button>${big?`<input class=minp data-minput type=number inputmode=decimal min=0 max=100 step=0.5 value="${x.pct}" aria-label="Inside margin percent">%`:`<b class=mval>${G(x.pct,1)}%</b>`}<button type=button class=mbtn data-mstep="1" aria-label="Raise margin">+</button>${x.pct_user?`<button type=button class=mreset data-mreset aria-label="Reset to ${G(x.pct_default,1)}%">${big?'Reset to '+G(x.pct_default,1)+'%':'reset'}</button>`:''}</span>`};
document.addEventListener('click',e=>{const t=e.target.closest('[data-mstep],[data-mreset]');if(!t)return;e.preventDefault();e.stopPropagation();const c=t.closest('[data-mstore]').dataset.mstore,s=S(c);
if(t.dataset.mreset!=null)return mReset(c);mSet(c,(s.insp.mtd.pct||0)+parseFloat(t.dataset.mstep));},true);
document.addEventListener('change',e=>{const t=e.target;if(!t.matches||!t.matches('[data-minput]'))return;const v=parseFloat(t.value);if(isFinite(v))mSet(t.closest('[data-mstore]').dataset.mstore,v);});
function route(){D.stores.forEach(mApply);const h=location.hash.replace(/^#\/?/,'').split('/');try{
if(h[0]==='all'&&D.stores.length>1)return allView();if(S(h[1]))localStorage.removeItem('acall');
if(!h[0]&&D.stores.length>1&&localStorage.getItem('acall')==='1')return allView();
if(h[0]==='s'&&S(h[1])){const s=S(h[1]);localStorage.setItem('acstore',s.code);switch(h[2]){
case'diff':return h[3]?diffDay(s,h[3]):diff(s);case'fuel':return h[3]==='day'?fuelDay(s,h[4]):fuel(s);case'load':return load(s,h[3]);
case'food':return food(s,h[3]?decodeURIComponent(h[3]):null);case'inside':return inside(s,h[3]==='y'?'y':'mtd');case'margin':return margin(s,h[3]==='y'?'y':'mtd');case'items':return items(s,h[3]==='y'?'y':'mtd',h[4]?decodeURIComponent(h[4]):null);case'velo':return velo(s,h[3],h[4]?decodeURIComponent(h[4]):null);case'cards':return cards(s);case'prices':return prices(s);case'pnl':return h[3]?plist(s,h[3]):pnl(s);case'scans':return scans(s);case'tanks':return tanks(s);case'tank':return tank(s,h[3]);case'house':return h[3]?acct(s,h[3]):house(s);}}
if(h[0]==='paper')return paper(h[1],h[2],h[3]);if(h[0]==='home')return home(h[1]);if(h[0]==='alerts')return alerts(h[1]);if(h[0]==='glance')return glance(h[1]);}
catch(e){console.error(e);return page('Error',['#/','Dashboard'],'<div class=card>Something went wrong: '+E(e.message)+'</div>');}
home();}
</script></body></html>
